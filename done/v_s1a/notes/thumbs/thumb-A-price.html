<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Inter;src:url(fonts/Inter-Medium.otf);font-weight:500}
@font-face{font-family:Inter;src:url(fonts/Inter-SemiBold.otf);font-weight:600}
@font-face{font-family:Inter;src:url(fonts/Inter-Bold.otf);font-weight:700 800}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1280px;height:720px;background:#0D1117;color:#E6EDF3;font-family:Inter,sans-serif;overflow:hidden;position:relative}
.grid{position:absolute;inset:0;background-image:linear-gradient(#30363D33 1px,transparent 1px),linear-gradient(90deg,#30363D33 1px,transparent 1px);background-size:64px 64px}
.k{position:absolute;left:72px;top:118px;font-size:50px;font-weight:700;color:#8B949E}
h1{position:absolute;left:66px;top:186px;font-size:150px;font-weight:800;letter-spacing:-5px;line-height:.92}
.red{color:#F85149}
.sub{position:absolute;left:72px;top:500px;font-size:40px;font-weight:600;color:#8B949E}
.sub b{color:#3FB950}
.card{position:absolute;left:720px;top:150px;width:500px;background:#161B22;border:2px solid #30363D;border-radius:22px;padding:30px 34px}
.cap{font-size:20px;font-weight:700;letter-spacing:.12em;color:#8B949E;text-transform:uppercase}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:20px;font-size:32px;font-weight:600}
.lbl{color:#8B949E;font-weight:500;font-size:28px}
.note{margin-top:14px;font-size:34px;font-weight:600}
.ring{border:5px solid #F85149;border-radius:999px;padding:4px 18px;margin-right:-23px}
.tag{font-size:22px;background:#F8514926;color:#FF9A94;border-radius:8px;padding:3px 10px;margin-left:10px;font-weight:600}
</style></head><body><div class=grid></div>

<h1>NO PET<br><span class=red>FEE.</span></h1>

<div class=card>
 <div class=cap>Staff page · new booking</div>
 <div class=note>&ldquo;We have 2 cats.&rdquo;</div>
 <div class=row><span class=lbl>Pets</span><span>No</span></div>
 <div class=row><span class=lbl>Price</span><span class=ring>$150.00</span></div>
 <div class=row><span class=lbl>Cleaner</span><span class=ring>Ana<span class=tag>cat allergy</span></span></div>
</div>
</body></html>
